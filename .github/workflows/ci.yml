name: 'ci'
on:
  workflow_dispatch:
    inputs:
      secure-registry:
        description: 'Harden-Runner secure-registry input'
        type: choice
        options: ['false', 'true']
        default: 'false'
      lockfile:
        description: 'keep = install from pnpm-lock.yaml, fresh = delete it and resolve again'
        type: choice
        options: [keep, fresh]
        default: keep

run-name: 'ci secure-registry=${{ inputs.secure-registry }} lockfile=${{ inputs.lockfile }}'

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      secure-registry: ${{ inputs.secure-registry }}
      lockfile: ${{ inputs.lockfile }}
